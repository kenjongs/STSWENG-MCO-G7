name: Main Release Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-source:
    name: Require release branch for main
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR source branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}

        run: |
          echo "Source: $SOURCE_BRANCH"
          echo "Target: main"

          if [[ "$SOURCE_REPO" != "$TARGET_REPO" ]]; then
            echo "::error::Release PRs must come from this repository."
            exit 1
          fi

          if [[ ! "$SOURCE_BRANCH" =~ ^release/.+$ ]]; then
            echo "::error::Only release/* branches can merge into main."
            exit 1
          fi

          echo "Release branch validated."
